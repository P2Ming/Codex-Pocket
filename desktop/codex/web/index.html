<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Codex Pocket</title>
<style>
:root{font:16px system-ui,-apple-system,sans-serif;color:#e6edf3;background:#0d1117}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{background:#238636;color:#fff;border:0;border-radius:9px;padding:10px 14px;cursor:pointer}button:disabled{opacity:.5}input,textarea{background:#161b22;color:#e6edf3;border:1px solid #30363d;border-radius:9px;padding:12px}header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #30363d}h1{font-size:18px;margin:0}main{display:grid;grid-template-columns:280px 1fr;height:calc(100dvh - 57px)}aside{border-right:1px solid #30363d;overflow:auto;padding:12px}#threads{display:grid;gap:6px;margin-top:12px}.thread{display:block;width:100%;text-align:left;background:#161b22;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}section{display:flex;flex-direction:column;min-width:0}#title{padding:12px 16px;border-bottom:1px solid #30363d;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#turnState{font-size:12px;color:#8b949e;margin-left:8px}#messages{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}.item{white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid #30363d;border-radius:12px;padding:12px;max-width:900px}.user{background:#142d1d;align-self:flex-end}.agent{background:#161b22;align-self:flex-start}.meta{font-size:12px;color:#8b949e;margin-bottom:5px}form#composer{display:flex;gap:8px;padding:12px;border-top:1px solid #30363d}textarea{flex:1;resize:vertical;min-height:52px;max-height:180px}#login{position:fixed;inset:0;display:grid;place-items:center;background:#0d1117;z-index:10}#login[hidden]{display:none}#login form{display:grid;gap:12px;width:min(90vw,360px)}#login h2{margin:0}#error{color:#ff7b72;min-height:1.5em}#approvals{position:fixed;left:12px;right:12px;bottom:90px;display:grid;gap:8px;pointer-events:none}.approval{pointer-events:auto;background:#24292f;border:1px solid #d29922;border-radius:12px;padding:12px;max-height:35vh;overflow:auto}.approval pre{white-space:pre-wrap;overflow-wrap:anywhere}#notice{padding:10px 16px;background:#3b261a;color:#ffd8a8;border-bottom:1px solid #9a6700}#notice:empty{display:none}#notice button{margin-left:10px}#status{font-size:12px;color:#8b949e}@media(max-width:700px){main{grid-template-columns:1fr}aside{height:130px;border-right:0;border-bottom:1px solid #30363d}#threads{display:flex;overflow:auto}.thread{min-width:170px;width:170px}section{height:calc(100dvh - 187px)}}
</style>
<style>
header{height:57px;padding:10px 16px}.header-actions{display:flex;align-items:center;gap:12px}.settings-trigger{width:36px;height:36px;padding:0;background:#212b36;font-size:21px}.login-settings{background:transparent;color:#9fb4c8;border:1px solid #394653}.settings-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.settings-head h2{margin:0;font-size:20px}.settings-head button{padding:4px 9px;background:transparent;color:inherit;font-size:20px}#settings{width:min(92vw,360px);border:1px solid #394653;border-radius:8px;background:#161b22;color:#e6edf3;padding:22px;box-shadow:0 24px 70px #0008}#settings::backdrop{background:#000a}#settings .settings-body{display:grid;gap:11px}.theme-options{display:grid;grid-template-columns:1fr 1fr;gap:8px}.theme-options button{background:#252e38;color:#dce6ee;border:1px solid #3c4955}.theme-options button[aria-pressed="true"]{background:#238636;color:#fff;border-color:#238636}
html[data-theme="light"]{background:#f6f8f7;color:#182720}html[data-theme="light"] header,html[data-theme="light"] #title,html[data-theme="light"] form#composer,html[data-theme="light"] .model-bar{border-color:#d8e2dd}html[data-theme="light"] aside{border-color:#d8e2dd}html[data-theme="light"] input,html[data-theme="light"] textarea{background:#fff;color:#182720;border-color:#c3d2c9}html[data-theme="light"] .thread,html[data-theme="light"] .item.agent{background:#fff;color:#182720;border-color:#d8e2dd}html[data-theme="light"] .item.user{background:#e0f2e7;color:#182720;border-color:#aad5ba}html[data-theme="light"] #status,html[data-theme="light"] #turnState,html[data-theme="light"] .meta{color:#566c60}html[data-theme="light"] #login{background:#f6f8f7}html[data-theme="light"] .settings-trigger,html[data-theme="light"] .login-settings{background:#e7eee9;color:#20362a;border-color:#c6d7cd}html[data-theme="light"] #settings{background:#fff;color:#182720;border-color:#d8e2dd}html[data-theme="light"] .theme-options button{background:#edf3ef;color:#263a2f;border-color:#cbdcd0}html[data-theme="light"] .theme-options button[aria-pressed="true"]{background:#238636;color:#fff;border-color:#238636}html[data-theme="light"] .approval{background:#fff9e9;color:#182720}
.model-bar{display:flex;gap:8px;padding:8px 16px;border-bottom:1px solid #30363d}.model-bar label{display:flex;align-items:center;gap:6px;min-width:0;font-size:12px;color:#8b949e}.model-bar label:first-child{flex:1}.model-bar label:last-child{width:140px}.model-bar select{min-width:0;width:100%;padding:6px 8px;border:1px solid #30363d;border-radius:7px;background:#161b22;color:#e6edf3;font:inherit}html[data-theme="light"] .model-bar select{background:#fff;color:#182720;border-color:#c3d2c9}html[data-theme="light"] .model-bar label{color:#566c60}@media(max-width:700px){.model-bar{padding:7px 12px}.model-bar label:last-child{width:100px}.model-bar label{gap:3px}}
.question-panel{width:min(100%,420px);margin-top:8px;padding:12px;border:1px solid #466552;border-radius:8px;background:#1c2b23;display:grid;gap:10px}.question-panel fieldset{min-width:0;margin:0;padding:0;border:0}.question-panel legend{font-size:13px;font-weight:600;margin-bottom:8px}.question-options{display:grid;gap:6px}.question-option{text-align:left;background:#263b2d;color:#e6f3e9;border:1px solid #497254;border-radius:7px;padding:9px 11px}.question-option[aria-pressed="true"]{background:#238636;border-color:#55a76a}.question-custom{width:100%;margin-top:7px;font-size:16px}.question-submit{justify-self:start;padding:8px 12px}.input-request .question-panel{margin:0}html[data-theme="light"] .question-panel{background:#f0f7f1;color:#193a25;border-color:#b5d3bd}html[data-theme="light"] .question-option{background:#fff;color:#193a25;border-color:#b5d3bd}html[data-theme="light"] .question-option[aria-pressed="true"]{background:#d3ebd9}
</style>
</head>
<body>
<header><h1>Codex Pocket</h1><div class="header-actions"><span id="status">连接中</span><button class="settings-trigger" data-toggle-theme type="button" aria-label="切换白天模式" title="切换白天模式">☀</button></div></header>
<main><aside><button id="new">新任务</button><div id="threads"></div></aside><section><div id="title">选择一个任务 <span id="turnState" aria-live="polite"></span></div><div class="model-bar"><label>模型<select id="modelSelect" aria-label="模型"><option value="">默认模型</option></select></label><label>推理<select id="effortSelect" aria-label="推理档位" disabled><option value="">默认</option></select></label></div><div id="notice" role="alert"></div><div id="messages"></div><form id="composer"><textarea id="prompt" placeholder="给 Codex 发消息" required></textarea><button type="submit">发送</button></form></section></main>
<div id="approvals"></div><div id="login"><form id="loginForm"><h2>输入访问密码</h2><input id="pin" type="password" autocomplete="current-password" required><button type="submit">登录</button><button class="login-settings" data-toggle-theme type="button" aria-label="切换白天模式">☀</button><div id="error"></div></form></div>
<script src="/preferences.js" defer></script>
<script src="/questions.js" defer></script>
<script src="/app.js" defer></script>
</body>
</html>
