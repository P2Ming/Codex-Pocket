<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101319">
<title>Codex Pocket</title>
<link rel="stylesheet" href="/mobile.css">
<script src="/preferences.js" defer></script>
<script src="/questions.js" defer></script>
<script src="/mobile.js" defer></script>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div class="brand"><button id="menu" class="icon-button mobile-only" type="button" aria-label="打开会话列表" aria-expanded="false">☰</button><span class="brand-mark" aria-hidden="true">✳</span><span><strong>Codex Pocket</strong><small>你的随身工作台</small></span></div>
    <div class="top-actions"><span id="mobileTurnState" class="mobile-turn-state" aria-live="polite">待机</span><span id="status" class="connection" aria-live="polite">连接中</span><button class="icon-button" data-toggle-theme type="button" aria-label="切换白天模式" title="切换白天模式">☀</button><button class="icon-button shell-settings" id="shellSettings" type="button" aria-label="设置服务器地址" title="设置服务器地址">⚙</button></div>
  </header>
  <main class="main-layout">
    <button id="drawerBackdrop" class="drawer-backdrop" type="button" aria-label="关闭会话列表" hidden></button>
    <aside id="sidebar" class="sidebar" aria-label="会话列表">
      <div class="sidebar-head"><span class="eyebrow">工作空间</span><button id="closeMenu" class="icon-button mobile-only" type="button" aria-label="关闭会话列表">✕</button></div>
      <button id="new" class="new-thread" type="button"><span>＋</span> 新建会话</button>
      <label class="search-wrap"><span aria-hidden="true">⌕</span><input id="threadSearch" type="search" placeholder="搜索会话" autocomplete="off" aria-label="搜索会话"></label>
      <div class="list-caption"><span>最近会话</span><span id="threadCount">0</span></div>
      <div id="threads" class="thread-list"></div>
      <div class="sidebar-foot">通过 NAS 安全连接 · 消息保存在本机 Codex</div>
    </aside>
    <section class="conversation" aria-label="聊天">
      <div class="conversation-head"><div class="conversation-heading"><span class="eyebrow">当前会话</span><h1 id="title">选择一个会话</h1></div><span id="turnState" class="turn-state" aria-live="polite">等待选择</span></div>
      <div class="model-bar"><label class="model-field"><span>模型</span><select id="modelSelect" aria-label="模型"><option value="">默认模型</option></select></label><label class="effort-field"><span>推理</span><select id="effortSelect" aria-label="推理档位" disabled><option value="">默认</option></select></label></div>
      <div id="notice" class="notice" role="alert"></div>
      <div id="messages" class="messages"><div id="emptyState" class="empty-state"><span class="empty-mark" aria-hidden="true">✳</span><h2>继续你的工作</h2><p>打开左侧会话，或创建一个新会话开始。</p></div></div>
      <div id="approvals" class="approvals" aria-live="polite"></div>
      <form id="composer" class="composer"><label class="sr-only" for="prompt">发送给 Codex</label><textarea id="prompt" placeholder="给 Codex 发消息…" rows="1" required></textarea><button id="send" class="send-button" type="submit" aria-label="发送消息"><span id="sendLabel">发送</span><span aria-hidden="true">↗</span></button></form>
    </section>
  </main>
</div>
<div id="login" class="login-overlay"><form id="loginForm" class="login-card"><span class="login-mark" aria-hidden="true">✳</span><span class="eyebrow">安全连接</span><h2>欢迎回来</h2><p>输入 Pocket 访问密码，连接你的 Codex 工作台。</p><label for="pin">访问密码</label><input id="pin" type="password" autocomplete="current-password" placeholder="输入访问密码" required><label class="remember-row" for="rememberPin"><input id="rememberPin" type="checkbox">记住密码</label><button type="submit">进入工作台 <span aria-hidden="true">↗</span></button><button class="login-settings" data-toggle-theme type="button" aria-label="切换白天模式">☀</button><div id="error" role="alert"></div></form></div>
</body>
</html>
